[package]
name = "pdg-rs"
description = "Programmatic access to the Particle Data Group's database with Rust"
version = "0.2.0"
edition = "2024"
authors = ["Nathaniel Dene Hoffman <nhoffman@wm.edu>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/denehoffman/pdg-rs"
keywords = ["particle", "physics", "pdg"]
categories = ["command-line-utilities", "science"]
rust-version = "1.88.0"
exclude = ["data/*.sqlite"]

[[bin]]
name = "pdg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.9"
comfy-table = { version = "7.2.2", features = ["custom_styling"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "osc52", "windows"], optional = true }
directories = "6.0.0"
num = { version = "0.4.3", optional = true }
owo-colors = "4.3.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"], optional = true }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
strsim = "0.11.1"
tempfile = "3.23.0"
thiserror = "2.0.18"
ureq = "2.12.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[features]
default = ["ratio", "tui"]
num = ["dep:num"]
ratio = ["num"]
tui = ["dep:crossterm", "dep:ratatui"]

[lints.clippy]
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
format_push_string = "allow"
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
strip = "none"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "./docs-header.html"]
