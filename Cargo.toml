[package]
name = "pdg-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pdg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
comfy-table = "7.2.1"
num = { version = "0.4.3", optional = true }
owo-colors = "4.2.3"
rusqlite = { version = "0.39.0", features = ["bundled", "serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

[features]
default = ["ratio"]
num = ["dep:num"]
ratio = ["num"]
